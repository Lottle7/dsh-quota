name: Feature request
description: Suggest a provider, workflow or interface improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you unable to understand or complete today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: input
    id: provider_docs
    attributes:
      label: Official provider API documentation
      description: Required for new balance/quota adapters.
